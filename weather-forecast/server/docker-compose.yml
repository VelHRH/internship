version: '3'

services:
  postgresql:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: 0000
      POSTGRES_USER: valik
      POSTGRES_DB: weather
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-host=trust
  redis:
    container_name: redis
    image: redis:7.2.4-alpine
    ports:
      - 6379:6379
